north_star:
  primary_readers:
    - restructuring partners
    - receivers/controllers
    - voluntary administrators
    - secured lenders / credit executives
    - restructuring and insolvency lawyers
    - turnaround advisers
    - special-situations investors
  reader_must_answer_within_15_20_minutes:
    - "Why is this not a conventional property realisation?"
    - "What could materially change the recovery outcome?"
    - "Where would specialist commercial vendor due diligence add value here?"
    - "When should I bring in a specialist SDA commercial adviser?"
  positioning: "Commercial SDA guide. Not legal advice. Not a general SDA market report. Companion to SDA Market Report 2026, not a duplicate of it."

# Previous journey (skeleton_v0.5): SECURE -> RECONCILE -> DIAGNOSE -> PROTECT VALUE ->
# DECIDE. Retained as the analytical spine inside "commercial vendor due diligence,"
# but the reader-facing journey now names the actor and the value-protection mechanism
# before walking through the analysis.
narrative_arc:
  - UNDERSTAND          # SDA is not conventional property; two exposures; misleading headline data
  - ENGAGE SPECIALIST    # specialist SDA commercial adviser, named early
  - COMMERCIAL VENDOR DUE DILIGENCE   # reconcile, diagnose, value-reference (the old analytical spine)
  - REMEDY / POSITION    # what's economically remediable; segmentation; chokeholds
  - REALISE              # decide, go to market, specialist sales agency

