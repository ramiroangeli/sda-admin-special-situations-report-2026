    status: STEVE_ENDORSED
    note: "Steve reviewed and likes this framework as-is. Added: forensic-DD caveat that these are a diagnostic starting point, not a substitute for Commercial Vendor Due Diligence. See STEVE_FEEDBACK_SOURCE.md §14."
  - id: commercial_vendor_dd_journey
    name: "Commercial Vendor Due Diligence Journey"
    status: NEW
    note: "Replaces the old page-2 operating-pathway framework as the report's headline journey. See STRATEGIC_DIRECTION.md §3."
  - id: value_reference_points
    name: "Value Reference Points + Remaining Pricing Tenure"
    status: REVISED
    note: "Adds remaining SDA pricing tenure as a named value driver alongside the two value references and Current Recovery Position. Concept only — no specific tenure duration asserted as fact. See CLAIMS_AND_EVIDENCE_IMPACT.md ADM-R1-05."
  - id: segmentation_factor_set
    name: "Portfolio / Buyer Segmentation Factors"
    status: REVISED
    note: "Expanded from 4 factors to 11 (design category, building type, sprinkler configuration, remaining pricing tenure, participant/funding profile, operating state, provider structure, alternative-use value, SA4/geography, buyer/fund mandate, portfolio size/homogeneity). No named buyers, rankings or scoring. See STEVE_FEEDBACK_SOURCE.md §16."
  - id: decision_tree
    name: "SDA Appointment / Realisation Decision Tree"
    status: UNCHANGED
  - id: current_recoverability_factors
    name: "Hidden Chokeholds / What Affects Recoverability"
    status: RENAMED
    note: "Same underlying factor set as skeleton_v0.5's current_recoverability_factors; renamed and reframed to foreground the 'chokehold' concept and its remediable-vs-fundamental distinction."

