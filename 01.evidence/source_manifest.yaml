  verification_status: PRIMARY_TEXT_VERIFIED_WEB
  local_original_frozen: false
  local_evidence_note: public/public_evidence/PUB-08_provider_reenrolment.md
  supports_claims: ADM-P21-01
  scope_and_limits: 'Steps 4 and 6: outgoing provider cancellation; incoming application
    assessed as new even after prior enrolment; mandatory documentation and relevant
    certifications. Ownership alone is not stated as an automatic trigger.'
- source_id: PUB-11
  title: How to manage specialist disability accommodation (SDA) vacancies
  url: https://www.ndis.gov.au/providers/home-and-living-providers/specialist-disability-accommodation-sda/how-manage-specialist-disability-accommodation-sda-vacancies
  source_date: '2026-08-11'
  verified_at: '2026-09-29'
  verification_status: PRIMARY_TEXT_VERIFIED_WEB
  local_original_frozen: false
  local_evidence_note: public/public_evidence/PUB-11_sda_vacancy_payments.md
  supports_claims: ADM-P21-03
  scope_and_limits: 'Steps 2 and 4: limited eligibility for shared homes enrolled
    for 2 to 5 residents; specified departure circumstances, availability and notification
    conditions. Limits are up to 60 days for 2 to 3 residents or 90 days for 4 to
    5, ending when filled. Claims relate to remaining eligible days after physical
    departure and require evidence. Never-occupied newly built homes are excluded.
    Public copy deliberately avoids procedural detail and directs eligibility testing.'
- source_id: PUB-12
  title: Pricing Schedule for Specialist Disability Accommodation 2026-27
  url: https://www.ndis.gov.au/media/8844/download?attachment=
  source_date: '2026-09-24'
  verified_at: '2026-09-29'
  verification_status: PRIMARY_TEXT_VERIFIED_WEB
  local_original_frozen: false
  local_evidence_note: public/public_evidence/PUB-12_sda_pricing_schedule_gst.md
  supports_claims: ADM-P21-06
  scope_and_limits: 'Effective 24 September 2026; 58 pages. Section 3.1(c)(vi), printed
    page 4, includes input tax credits among pricing factors. Appendix 1 Table 1,
    page 5: GST not paid, or paid with credits claimed. Table 5, page 10: GST paid
    without credits claimed. Corresponding base amounts differ. No calculation or
    universal income effect is published. This is the current schedule, not merely
    the older pricing-arrangements document also linked on the landing page.'
- source_id: PUB-13
  title: National Disability Insurance Scheme - GST-free supplies
  url: https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/in-detail/your-industry/gst-and-health/national-disability-insurance-scheme
  source_date: '2024-06-12'
  verified_at: '2026-09-29'
  verification_status: PRIMARY_TEXT_VERIFIED_WEB
  local_original_frozen: false
  local_evidence_note: public/public_evidence/PUB-13_ato_ndis_gst.md
  supports_claims: ADM-P21-07
  scope_and_limits: 'ATO requires all stated conditions for GST-free NDIS supplies:
    an effective plan, specified reasonable and necessary supports, written agreement,
    and a supply covered by the applicable determination. This is not authority that
    all owner/provider management services are GST-free. Test the actual supply and
    arrangements with specialist tax advisers. No sector statistic or definitive transaction
    tax conclusion is published.'
