# Source Manifest — NDIS Specialist Disability Accommodation Administration Report 2026
#
# STATUS: PLANNING DRAFT. Seeds one record per source family named in the brief.
# This file does not grant publication rights — see claims_register.csv and
# confidentiality_rules.md. No confidential file has been copied into this pack;
# internal source families are recorded as placeholders only.

public_sources:
  - source_family: "NDIA SDA participants dataset"
    vintage: "30 June 2026"
    local_path: "ndis-python-v2/data/Supplement P Specialist Disability Accommodation 2025-26 Q4_0.xlsx"
    local_path_status: VERIFIED_LOCAL_SOURCE
    verification_method: >
      Vintage confirmed by inspecting the workbook's own internal XML content
      (table titles and embedded chart narrative; the file itself was not
      opened in Excel, modified, or otherwise altered). Table P.1 is titled
      "Active participants with SDA and SIL funding in current NDIS plan as at
      30 June 2026"; the Figure P.1 chart narrative text ends "In June 2026
      there were 16,644 active participants with SDA in use and 9,014 active
      participants eligible but not yet using SDA." This confirms the workbook
      is the FY2025-26 Q4 (30 June 2026) release of the NDIA's Quarterly report
      to disability ministers, Supplement P. Verified 2026-09-23.
    note: >
      Adjacent quarters (2025-26 Q2, Q3) and prior financial years (2024-25 Q4,
      2023-24 Q4, 2022-23 Q4) are also present locally and may be useful for
      trend framing on page 4.
    url: "TO_BE_FROZEN_LOCALLY"

  - source_family: "NDIA SDA Enrolled Dwellings and NDIS Demand workbook"
    vintage: "30 June 2026"
    local_path: "ndis-python-v2/data/Supplement P Specialist Disability Accommodation 2025-26 Q4_0.xlsx"
    local_path_status: VERIFIED_LOCAL_SOURCE
    verification_method: >
      This source family is not a separate NDIA publication from the participants
      dataset above — both are published together as one workbook (Supplement P).
      Tables P.4-P.18 in the SAME Q4_0.xlsx file (e.g. "Number of Enrolled SDA
      Dwellings by SA4 Region and Design Category as at 30 June 2026", "Number of
      Participants with identified SDA needs by status and SA4 Region as at 30
      June 2026") are explicitly dated 30 June 2026, confirmed by inspecting the
      workbook's internal XML content only (file not altered). Verified 2026-09-23.
    note: >
      CORRECTION to the previous pass: a second local file, "SDA Enrolled
      dwellings and NDIS demand data .xlsx" (also in ndis-python-v2/data/), was
      previously flagged as the candidate for this source family. Inspection
      shows it has the identical Supplement P table structure but is dated
      "as at 31 March 2026" (2025-26 Q3) — the WRONG vintage for a 30 June 2026
      citation. It is not a distinct "Enrolled Dwellings and Demand" NDIA
      publication; it is an earlier-quarter copy of the same Supplement P
      report, saved locally under a non-NDIA filename. Retained below as a
      prior-quarter comparison source only — do not cite it for 30 June 2026
      figures.
    url: "TO_BE_FROZEN_LOCALLY"

  - source_family: "NDIA SDA Enrolled Dwellings and NDIS Demand workbook (prior-quarter comparison only)"
    vintage: "31 March 2026 (2025-26 Q3) — NOT the 30 June 2026 vintage"
    local_path: "ndis-python-v2/data/SDA Enrolled dwellings and NDIS demand data .xlsx"
    local_path_status: VERIFIED_LOCAL_SOURCE_WRONG_VINTAGE
    verification_method: >
      Table titles inside this file (e.g. "Table P.1 Active participants with
      SDA and SIL funding in current NDIS plan as at 31 March 2026") confirm it
      is the 2025-26 Q3 Supplement P release, not Q4/30 June 2026. Confirmed by
      inspecting internal XML content only; file not altered. Verified
      2026-09-23.
    note: >
      Do not use to support any claim requiring the 30 June 2026 vintage. May be
      useful only as an explicit quarter-on-quarter comparison point (e.g. a
      trend note on page 4), clearly labelled as 31 March 2026 data if used.
    url: "TO_BE_FROZEN_LOCALLY"

