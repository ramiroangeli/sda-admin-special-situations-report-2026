public_evidence_notes_pack:
  # New this pass. Locally portable interpretation/indexing notes prepared from
  # current primary public sources (NDIA, Federal Register of Legislation,
  # ASIC). These notes are not substitutes for the underlying primary sources
  # or for the locally-held NDIA workbook — see the note attached to each
  # public_sources entry above for how each PUB-0X note relates to its
  # underlying source family.
  readme_path: "public_evidence_notes/README.md"
  index_path: "public_evidence_notes/evidence_index.csv"
  notes:
    - id: PUB-01
      path: "public_evidence_notes/public_evidence/PUB-01_ndia_q4_data.md"
      relates_to_source_family: ["NDIA SDA participants dataset", "NDIA SDA Enrolled Dwellings and NDIS Demand workbook"]
    - id: PUB-02
      path: "public_evidence_notes/public_evidence/PUB-02_sda_pricing_2026_27.md"
      relates_to_source_family: ["NDIS SDA Pricing Arrangements 2026–27", "NDIS SDA Price Calculator 2026–27"]
    - id: PUB-03
      path: "public_evidence_notes/public_evidence/PUB-03_sda_rules_current.md"
      relates_to_source_family: ["Specialist Disability Accommodation Rules 2020"]
    - id: PUB-04
      path: "public_evidence_notes/public_evidence/PUB-04_provider_guidance.md"
      relates_to_source_family: ["SDA provider guidance / Practice Standards"]
    - id: PUB-05
      path: "public_evidence_notes/public_evidence/PUB-05_asic_insolvency.md"
      relates_to_source_family: ["ASIC Series 1 and Series 2 insolvency statistics", "ASIC INFO 80"]
    - id: PUB-06
      path: "public_evidence_notes/public_evidence/PUB-06_plan_reassessment_2026.md"
      relates_to_source_family: ["NDIS 2026 plan reassessment / legislative changes"]
    - id: PUB-07
      path: "public/public_evidence/PUB-07_new_build_definition.md"
      relates_to_source_family: ["NDIS SDA Design Standard / Price Guide — New Build classification date"]
    - id: PUB-08
      path: "public/public_evidence/PUB-08_provider_reenrolment.md"
      relates_to_source_family: ["NDIS — How to enrol a home as SDA / change-of-provider guidance"]
    - id: PUB-09
      path: null
      relates_to_source_family: ["SDAHC Research — SDA Market Report 2026"]
      note: "No separate interpretation note — self-citation of SDAHC's own already-published report; see the source_family entry above directly."

