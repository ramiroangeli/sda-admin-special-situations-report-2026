  - page_id: page-23
    page_number: 23
    theme: white
    kicker_section: "Realise"
    title: "Where Specialist SDA Commercial Advice Adds Value"
    reader_question: null
    body_blocks:
      - type: paragraph
        text: "Specialist commercial vendor due diligence before sale is a core value-protection step for SDA assets. A conventional property sale process may fail to identify or resolve SDA-specific value drivers before the market prices the asset. Specialist SDA Commercial Vendor Due Diligence can distinguish between impairment that is remediable before sale and impairment that should instead be reflected in the realisation strategy: it is not a guarantee of optimal value, and this report does not claim to be one."
      - type: paragraph
        text: "Some of the diagnostic and transaction work described in this report benefits from specialist SDA input, not because it is legally required, but because SDA-specific commercial judgement is not always available inside a standard property or restructuring process."
