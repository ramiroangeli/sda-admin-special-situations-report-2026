  - page_id: page-19
    page_number: 19
    theme: paper
    kicker_section: "Remedy / Position"
    title: "Occupancy Quality Through Commercial Vendor Due Diligence"
    reader_question: "What sits behind the occupancy rate, and who determines whether it matters?"
    body_blocks:
      - type: paragraph
        text: "Occupancy percentage by itself can be insufficient for a recovery decision. Two portfolios, or two multi-place assets, can report the same headline occupancy rate and carry very different income risk, depending on what stands behind that number. Headline occupancy is an operating statistic; Specialist SDA Commercial Vendor Due Diligence tests the quality, sustainability and value relevance of the occupancy behind the headline rate."
      - type: paragraph
        text: "Five practical states are worth separating: occupied with aligned, evidenced funding; occupied with uncertain funding; occupied with temporary or non-SDA income support; vacant with a credible participant or funding pathway; and vacant with no credible pathway. Each implies a different starting point for the stabilise/hold/sell decision on page 18."
    body_blocks_after_visual:
      - type: paragraph
        style: strong
        text: "Occupancy rate alone can conceal material differences in income quality and stabilisation risk."
    visual_type: triage_matrix
    visual_data:
      rows:
        - state: "Occupied + aligned/evidenced funding"
          implication: "Lower immediate remediation requirement"
        - state: "Occupied + uncertain funding"
          implication: "Verify before relying on income"
        - state: "Occupied + temporary/non-SDA income"
          implication: "Income quality requires review"
        - state: "Vacant + credible funding pathway"
          implication: "Potential stabilisation case"
        - state: "Vacant + no credible pathway"
          implication: "Re-test the underlying SDA proposition"
    public_source_ids: []
    has_review: false

  - page_id: page-20
    page_number: 20
    theme: white
    kicker_section: "Remedy / Position"
    title: "From Vendor Due Diligence to Market"
    reader_question: "Am I actually ready to go to market?"
    body_blocks:
      - type: paragraph
        text: "Before a realisation strategy is fixed, all relevant information needs to be collated and reconciled. Where the appointee does not have specialist SDA expertise internally, a specialist commercial adviser should be considered for this work. Page 16 established what needs to be reconciled; this page establishes the order and the go/no-go judgement."
      - type: paragraph
        text: "Specialist SDA Commercial Vendor Due Diligence verifies the information held is accurate and consistent, and reconciles it against actual claims, funding and occupancy records. Before broad market launch, material issues found this way should be resolved where practical, or clearly identified and documented. Targeted market sounding or transaction preparation may run in parallel where timing pressure makes a sequential process uneconomic, consistent with page 8's observation that advisory and divestment work don't always have to wait on each other."
      - type: paragraph
        text: "Reasonable remedial and value-protection actions follow from that diagnosis, not before it. Once the asset or portfolio is market-ready (data room prepared around the resolved, or clearly flagged, position; defensible economics set using the NOI bridge from page 12, not the headline price from page 9; and the initial packaging strategy on page 17 established while retaining the ability to adapt it as credible market evidence emerges), a specialist SDA sales agency should be appointed for a targeted market process. A specialist agency should understand SDA portfolio sales, funding and occupancy economics, provider dynamics, buyer mandates, and in-use versus alternative-use value."
    body_blocks_after_visual:
      - type: paragraph
        style: callout-amber
        text: "Launching before material issues are resolved or documented doesn't remove the uncertainty: unresolved uncertainty can reappear in pricing, conditions, Buyer Due Diligence requests or execution time."
    visual_type: process_chain
    visual_data:
      orientation: horizontal
      steps: ["Specialist SDA Commercial Vendor Due Diligence", "Reasonable Remedial / Value-Protection Actions", "Asset / Portfolio Market-Ready", "Appoint Specialist SDA Sales Agency", "Targeted Market Process"]
    public_source_ids: []
    has_review: false

  - page_id: page-21
    page_number: 21
    theme: white
    kicker_section: Realise
    title: What Due Diligence May Reveal Before Realisation
    reader_question: What may not be visible from the headline income position?
    body_blocks:
    - type: paragraph
      text: '**Current income does not mean the future income stream is transaction-ready.** An enrolled,
        occupied SDA dwelling can appear sale-ready while carrying risks that interrupt income after sale.
        Other issues may represent recoverable value if identified before market.'
    - type: paragraph
      text: Specialist SDA Commercial Vendor Due Diligence distinguishes durable income, remediable uncertainty
        and risks that should shape pricing, transaction conditions or the realisation pathway. A complete
        headline rent roll is a starting point, not sufficient evidence to launch. The four lenses below
        show what the process on page 20 may reveal.
    - type: paragraph
      text: Historic enrolment records past status; it does not replace confirmation of the current documentary
        and compliance position. Original design, certification gaps, missing historical documents or compliance
        issues may require investigation before market. Understanding that position early helps avoid remediable
        uncertainty being priced into the asset.
    visual_type: diligence_lenses
    visual_data:
      cards:
      - title: Enrolment continuity
        paragraphs:
        - When a provider stops managing a dwelling, it must cancel enrolment. The incoming provider must
          apply afresh, even for a previously enrolled home, with the mandatory documents and relevant certifications.
        - A sale may prompt buyers, lenders or advisers to seek continuity evidence. In SDAHC's market experience,
          some buyers may make satisfactory enrolment evidence a transaction condition.
        takeaway: Confirm documentation and resolve remediable gaps before market.
      - title: Occupancy / vacancy income
        paragraphs:
        - Participants may leave for individual reasons. Eligible vacancy payments can temporarily support
          income after a participant moves out of a qualifying shared home; eligibility, duration and evidence
          must be tested.
        - They do not cover newly built SDA homes that have never housed a participant.
        takeaway: Test the income effect, any eligible claim and realistic replacement-occupancy timing.
      - title: Forensic commercial review
        paragraphs:
        - A de-identified, forensic-style review may be needed to reconcile participant funding, occupancy,
          provider records, claims, agreements and cash receipts without unnecessarily exposing participant
          identities.
        - Identify which income is durable, which discrepancies can be remedied and which risks belong in
          the realisation strategy.
        takeaway: Protect the opportunity for the strongest supportable realisation outcome.
      - title: Tax / GST / transaction structure
        paragraphs:
        - '**Freehold:** the current SDA pricing schedule distinguishes certain base amounts by historical
          GST and input-tax-credit treatment. Confirm the applicable treatment for each dwelling.'
        - '**Provider-business / management rights:** similar arrangements may have different GST treatment.
          Verify the supply, agreements and entity structure against applicable GST law with tax advisers.
          GST-free NDIS supplies require specific conditions; market practice is insufficient.'
        takeaway: Obtain specialist taxation advice.
      closing: For SDA freehold interests or provider-business rights, first establish the commercial position,
        then test it with appropriate legal and taxation advisers before the agency appointment and market
        process are finalised. Tax treatment can materially affect transaction economics and structure.
        **Obtain specialist taxation advice before fixing the realisation strategy.** Page 22 translates
        the findings into pathway decisions.
      steps:
      - Commercial diagnosis
      - Legal / tax review where required
      - Realisation strategy
      - Specialist market process
    public_source_ids:
    - PUB-08
    - PUB-11
    - PUB-12
    - PUB-13
    has_review: false

  - page_id: page-22
    page_number: 22
    theme: deep
    kicker_section: "Realise"
    title: "SDA Appointment / Realisation Decision Tree"
    reader_question: "What should I do next?"
    body_blocks:
      - type: paragraph
        style: lead
        text: "Start with one question: is verified sustainable income currently being produced?"
      - type: paragraph
        text: "If yes, test whether funding, occupancy, provider position and enrolment are all evidenced. If they are, test hold against a performing-SDA sale. If any of them isn't, treat the position as unresolved and return to reconciling and diagnosing."
      - type: paragraph
        text: "If not, the question becomes which source of impairment (page 14) is driving it, and each source points to what to test next, not to a fixed outcome. Operational prompts a test of whether remediation is economic; provider/contractual prompts a test of transition or contractual restructuring; capital structure prompts a test of security position, release conditions and transaction structure; fundamental asset prompts a re-test of the SDA proposition against the alternative-use position (page 13)."
    body_blocks_after_visual:
      - type: paragraph
        style: display
        text: "The eventual pathway follows from what that testing finds, not automatically from the diagnosis alone."
    visual_type: decision_tree
    visual_data:
      root: "Is verified sustainable income currently being produced?"
      yes_branch:
        question: "Are funding, occupancy, provider position and enrolment evidenced?"
        yes_leaf: "Test: Hold vs. Performing-SDA Sale"
        no_leaf: "Reconcile / Diagnose"
      no_branch:
        question: "What is driving the impairment? (page 14)"
        leaves:
          - source: "Operational"
            test: "Test: is remediation/stabilisation economic?"
          - source: "Provider / Contractual"
            test: "Test: provider transition / contractual restructure"
          - source: "Capital Structure"
            test: "Test: security, release conditions, structure"
          - source: "Fundamental Asset"
            test: "Re-test: SDA proposition vs. alternative use (p.13)"
      pathway_options: ["Hold", "Stabilise", "Provider restructure/transition", "Sell as performing SDA", "Sell as a special situation", "Segment portfolio (p.17)", "Alternative use / repurpose"]
