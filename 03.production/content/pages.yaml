  - page_id: page-02
    page_number: 2
    theme: white
    kicker_section: "Understand"
    title: "Why SDA Is Different"
    reader_question: "What am I actually dealing with?"
    body_blocks:
      - type: paragraph
        text: "Specialist Disability Accommodation, or SDA, is an emerging asset class. The New Build classification began on 1 April 2016, so data on New Build dwellings has existed for only around a decade; granular data is limited and, in many instances, not publicly available, and public comparable-sale evidence remains limited. A common source of value leakage is treating an SDA appointment as a conventional property realisation, because an SDA appointment is not one asset. **It is two.**"
      - type: paragraph
        text: "Because the class is nascent, SDA in-use value and alternative-use value can diverge significantly, in either direction. Sometimes that gap reflects a fundamental impairment. Sometimes it reflects a remediable chokehold. Specialist commercial diagnosis is what tells the difference: this report explains why, not how to perform that diagnosis yourself."
    body_blocks_after_visual:
      - type: paragraph
        text: "This report is a companion to *SDA Market Report 2026*, which provides commercial insight into the SDA asset class's first decade. This report does not repeat that material; it focuses on administration, distress, recovery and realisation for an individual appointment."
    visual_type: two_exposures
    visual_data:
      a:
        label: "A. The SDA Freehold Property"
        items:
          - "SDA in-use economics"
          - "Underlying alternative-use property value"
          - "Participant funding"
          - "Occupancy quality"
          - "Location"
          - "Design category"
          - "Building type"
          - "Fire sprinkler configuration"
          - "Remaining SDA pricing tenure"
          - "Provider arrangements"
          - "Buyer / investor mandates"
      b:
        label: "B. The SDA Provider Business / Provider Rights"
        items:
          - "Provider registration"
          - "Participant relationships"
          - "Service and management agreements"
          - "Claiming and administration"
          - "Tenancy and provider transition"
          - "Contractual rights and obligations"
          - "Current sustainable cash flow"
          - "Work in progress / participant pipeline"
          - "Brand / reputation value"
          - "Geographical reach"
      companion_note: "This report does not attempt a full provider-business valuation: the two exposures are not interchangeable, and an appointee needs to know which one they're actually assessing."
      qr_callout:
        eyebrow: "Read alongside"
        title: "SDA Market Report 2026"
    public_source_ids: [PUB-07]
    has_review: false

  - page_id: page-03
