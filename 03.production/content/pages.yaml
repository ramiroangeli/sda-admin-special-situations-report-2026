  - page_id: page-15
    page_number: 15
    theme: paper
    kicker_section: "Remedy / Position"
    title: "Hidden Chokeholds: What Affects Recoverability"
    reader_question: "What can go wrong, and is it fixable?"
    body_blocks:
      - type: paragraph
        text: "The Current Recovery Position for an SDA asset (page 13) is not fixed; it moves with a number of factors, some within an appointee's control and some not. It does not necessarily start at, or move toward, the SDA in-use value reference; the two are related but distinct questions."
      - type: paragraph
        text: "Not every constraint on recoverability is the same kind of problem. Some are chokeholds: specific, identifiable and economically remediable before a sale. Others are fundamental, and no reasonable remediation changes the underlying position. This commercial review exists to tell the two apart, asset by asset, rather than assuming either one by default."
    body_blocks_after_visual:
      - type: paragraph
        text: "No single percentage applies to any of these: the effect is specific to the asset, not a rule of thumb that transfers between matters."
      - type: paragraph
        text: "Each of the four sources of impairment from page 14 tends to affect a different subset of these factors. Mapping the two together, and testing which factors are genuinely remediable, helps identify where value-protection effort may be most effective."
    visual_type: factor_center
    visual_data:
      center: "Current Recovery Position"
      factors: ["Vacancy / occupancy", "Participant funding", "Provider position", "Operating costs", "CAPEX / compliance", "Holding time / carry", "Contractual friction", "Transaction execution risk"]
      two_state_note: "Remediable chokehold, or fundamental impairment? A framing question for each factor above, not a scored classification."
    public_source_ids: []
    has_review: false

  - page_id: page-16
    page_number: 16
    theme: white
    kicker_section: "Remedy / Position"
    title: "Information Readiness"
    reader_question: "Do I possess defensible evidence?"
    body_blocks:
      - type: paragraph
        text: "Before broad market launch or Buyer Due Diligence, the reader needs to know whether the evidence underneath the asset is actually defensible, not just complete-looking. That assessment runs across seven principal information categories that need to be reconciled together, not checked off in isolation."
    body_blocks_after_visual:
      - type: paragraph
        text: "Missing or inconsistent information in any of these categories does not just slow a process down; it becomes a value-at-risk issue once a buyer starts pricing the uncertainty. Reconciling them together, rather than category by category, is where Specialist SDA Commercial Vendor Due Diligence typically finds what a simpler review misses."
      - type: paragraph
        text: "A detailed appointment-specific information request will vary according to the property, provider structure, participant/funding position and proposed realisation pathway. This report therefore sets out the principal information categories rather than the full diligence protocol. SDAHC maintains a more detailed appointment-specific Vendor Due Diligence protocol. This page is the audit; whether you should actually launch, and in what order, is page 20's question."
