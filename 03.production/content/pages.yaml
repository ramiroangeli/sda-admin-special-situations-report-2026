  - page_id: page-18
    page_number: 18
    theme: white
    kicker_section: "Realise"
    title: "Stabilise, Hold or Sell?"
    reader_question: "Is time creating value or destroying it?"
    body_blocks:
      - type: paragraph
        text: "There is no universally correct answer to whether time helps or hurts recovery. Stabilisation can create value (closing an occupancy gap, completing a provider transition, finishing outstanding CAPEX) or it can destroy it, through carry cost, continued vacancy and drift."
      - type: paragraph
        text: "The decision comes down to balancing recovery potential against the cost of delay: how much recoverable improvement exists relative to the Current Recovery Position (page 13), how long that takes, what it costs to hold, and which source of impairment (page 14) is actually driving the distress. A provider-contractual problem with a credible transition plan is a different holding decision from a fundamental asset problem with no realistic fix."
      - type: paragraph
        text: "SDA remains a complex and relatively nascent asset class. Every property or portfolio therefore warrants an asset-specific level of commercial diligence before the realisation strategy is fixed. Taking an asset to market through a conventional process before Vendor Due Diligence may cause remediable SDA-specific value drivers to be priced as uncertainty rather than resolved before sale."
    body_blocks_after_visual:
      - type: paragraph
        style: display-red
        text: "A sequential rule, \"fix everything, then decide,\" is not always the right posture. Sometimes the clock is the biggest risk in the file."
    visual_type: decision_balance
    visual_data:
      left:
        label: "Potential value from waiting"
        items:
          - "Occupancy improvement"
          - "Provider transition"
          - "Completion of required CAPEX / remediation"
          - "Other credible stabilisation upside"
      right:
        label: "Cost / risk of waiting"
        items:
          - "Carry cost"
          - "Continued vacancy"
          - "Time"
          - "Execution drift / deteriorating position"
      decision_label: "Decision to test"
      options:
        - "Stabilise"
        - "Hold"
        - "Sell"
        - "Expedited exit / protect downside"
      caption: "The decision depends on the balance between credible recovery potential and the cost of delay."
