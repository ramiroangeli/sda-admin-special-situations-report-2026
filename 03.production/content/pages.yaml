  - page_id: page-17
    page_number: 17
    theme: paper
    kicker_section: "Remedy / Position"
    title: "One Portfolio or Several Transactions?"
    reader_question: "What should I do next?"
    body_blocks:
      - type: paragraph
        text: "A portfolio does not have to be sold the way it was financed or owned. **Packaging is a recovery decision, not a marketing format:** the choice affects achievable value, the buyer universe you reach, and execution risk."
      - type: paragraph
        text: "Buyer universe and achievable value can depend on considerably more than geography and provider structure alone. Institutional and fund mandates can differ materially, without any named buyer being identifiable from the pattern: these are examples of market segmentation dynamics, not a named buyer's mandate, a ranking, or SDAHC's own scoring or matching logic."
    body_blocks_after_visual:
      - type: paragraph
        text: "Bundling may improve execution in some circumstances, while in others it can obscure asset-specific risk or narrow the buyer universe. A stronger asset may sometimes support the marketability of a weaker but complementary one; conversely, a strong and weak asset may simply have different buyer universes. The right answer depends on execution certainty and recovery, not on how the portfolio presents on a summary schedule."
    visual_type: segmentation_grid
    visual_data:
      factors: ["SDA design category", "Building type", "Fire sprinkler configuration", "Remaining SDA pricing tenure", "Participant / funding profile", "Operating state", "Provider structure", "Alternative-use value", "Geographic / SA4 location", "Buyer / fund mandate", "Portfolio size and homogeneity"]
      examples_label: "Examples of market segmentation dynamics"
      examples:
        - "Some funds target specific design categories; others will consider multiple or all categories."
        - "Some require or prefer Class 3 or sprinkler-configured stock."
        - "Some exclude particular SA4 markets."
        - "Underwriting and discounted-cash-flow assumptions can vary by geography."
      outcomes: ["Single sale", "Segmented sale"]
