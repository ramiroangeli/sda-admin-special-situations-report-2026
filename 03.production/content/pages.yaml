  - page_id: page-04
    page_number: 4
    theme: paper
    kicker_section: "Reference"
    title: "Common SDA Terms & Abbreviations"
    reader_question: null
    body_blocks:
      - type: paragraph
        text: "This report assumes property, restructuring and lending expertise, not existing SDA sector knowledge. The terms below recur throughout the report and are defined here for quick reference."
    visual_type: glossary
    visual_data:
      groups:
        - name: "SDA / NDIS"
          terms:
            - term: "SDA"
              definition: "Specialist Disability Accommodation: housing funded under the NDIS for participants with extreme functional impairment or very high support needs."
            - term: "NDIS"
              definition: "National Disability Insurance Scheme: the national scheme that funds supports for eligible people with disability, including SDA."
            - term: "NDIA"
              definition: "National Disability Insurance Agency: the Commonwealth agency that administers the NDIS and enrols and pays for SDA."
            - term: "Enrolled Dwelling"
              definition: "A dwelling formally enrolled with the NDIA as meeting SDA requirements, making it eligible to attract SDA payments."
            - term: "SDA Provider"
              definition: "An organisation registered to deliver, and claim payment for, SDA at an enrolled dwelling."
        - name: "Design Categories"
          terms:
            - term: "HPS"
              definition: "High Physical Support: SDA design category for participants with significant physical support needs."
            - term: "FA"
              definition: "Fully Accessible: SDA design category built to a high physical accessibility standard."
            - term: "IL"
              definition: "Improved Liveability: SDA design category supporting participants with sensory, intellectual or cognitive impairment."
            - term: "Robust"
              definition: "SDA design category built for durability and safety, typically for participants whose behaviour may damage conventional building fabric."
            - term: "Basic"
              definition: "SDA design category for housing without specialised design features but with other SDA characteristics. Basic is available for Existing Stock, not New Build dwellings."
        - name: "Housing / Support"
          terms:
            - term: "SIL"
              definition: "Supported Independent Living: NDIS-funded support for daily living tasks, funded and delivered separately from SDA."
            - term: "RRC"
              definition: "Reasonable Rent Contribution: the tenancy-style rent a resident pays a provider, separate from and in addition to SDA payments."
        - name: "Property / Economics"
          terms:
            - term: "New Build"
              definition: "SDA classification for dwellings meeting the applicable New Build criteria, including the relevant certificate-of-occupancy requirements from 1 April 2016."
            - term: "Existing Stock"
              definition: "SDA classification for a dwelling that does not meet the New Build definition, priced on a different basis."
            - term: "NOI"
              definition: "Net Operating Income: income remaining after operating costs, before debt service and capital items."
            - term: "CAPEX"
              definition: "Capital Expenditure: spending on capital works, as distinct from routine operating costs."
            - term: "Vendor Due Diligence (VDD)"
              definition: "A vendor's own pre-sale investigation of an asset's position. This report's central concept, Specialist SDA Commercial Vendor Due Diligence, is the SDA-specific version of it."
        - name: "Geography / Market"
          terms:
            - term: "SA4"
              definition: "Statistical Area Level 4: an ABS geography classification commonly used to describe SDA supply and demand by region."
      note: "Definitions are provided for orientation only and do not restate or modify the meaning of any NDIS instrument."
    public_source_ids: [PUB-03, PUB-07]
    has_review: false

  - page_id: page-05
    page_number: 5
    theme: paper
    kicker_section: "Understand"
    title: "What the Headline Demand Data Does Not Tell You"
    reader_question: "Does eligible SDA funding mean viable demand for this dwelling?"
    body_blocks:
      - type: paragraph
        text: "As at 30 June 2026 (the latest official dataset verified for this report), 16,644 active participants had SDA funding in use, and a further 9,014 were assessed as eligible for SDA but not yet using it. Nationally, 14,235 dwellings were enrolled as SDA, representing an estimated 31,065 enrolled SDA places (see below); enrolled dwellings grew from 7,925 in June 2023 to 14,235 in June 2026, and annualised SDA supports over the same period rose from $365m to $684m."
      - type: paragraph
        text: "**Eligibility, or the existence of SDA funding, does not by itself establish commercially viable demand for a particular enrolled dwelling.** The quarterly data is not granular enough for an investor to tell, from the headline eligible-not-using count, whether an individual participant's funding level is commercially aligned with a specific dwelling's enrolled pricing capacity. A participant can technically hold SDA funding at a level materially below the enrolled income capacity of the dwelling they wish to occupy."
      - type: paragraph
        text: "The consequence: headline eligible-not-using volume may overstate economically addressable demand for some properties, and a physically occupied place can still be materially underfunded relative to its enrolled pricing capacity. Some of these situations can be remediated. Others cannot: identifying which is a diagnosis, not an assumption either way."
      - type: paragraph
        text: "NDIA quarterly reporting has separated \"eligible, not yet using\" from \"using\" participants only since the Q4 2024-25 (30 June 2025) release. Across the four quarters this split has been published, the count has moved from 9,880 (June 2025) to 9,577 (December 2025) to 9,370 (March 2026) to 9,014 (June 2026): a 12-month decline, not a static three-year pattern. From 27 August 2026, new plan-reassessment requirements apply; the effect on individual SDA funding outcomes should not be inferred from this change alone."
    visual_type: stat_cards
    visual_data:
      cards:
        - value: "16,644"
          label: "SDA in use"
        - value: "9,014"
          label: "Eligible, not yet using"
        - value: "31,065"
          label: "Enrolled SDA places"
      caption: "As at 30 June 2026: separate NDIA measures, not a combined vacancy rate. Enrolled SDA places: SDAHC Research calculation from NDIA dwelling-capacity data (Table P.6)."
      highlight_metric:
        prefix: "circa"
        value: "46%"
        label: "Estimated enrolled SDA place capacity not occupied by participants with SDA funding in use"
        footnote: "SDAHC Research / market analysis: calculated by comparing active participants with SDA in use against estimated enrolled SDA place capacity. This is a utilisation measure, not an NDIA vacancy statistic."
      # Visual data drawn from figures already stated in this page's body copy
      # (the four published quarters; in-use vs enrolled places). No new numbers.
      trend:
        label: "Eligible, not yet using"
        points:
          - {value: "9,880", period: "June 2025", month: 0}
          - {value: "9,577", period: "December 2025", month: 6}
          - {value: "9,370", period: "March 2026", month: 9}
          - {value: "9,014", period: "June 2026", month: 12}
      utilisation:
        in_use: "16,644"
        places: "31,065"
        in_use_pct: 53.6
    public_source_ids: [PUB-01, PUB-05, PUB-06, PUB-09]
    has_review: false

  - page_id: page-06
    page_number: 6
    theme: white
    kicker_section: "Understand"
    title: "What Must Line Up for an SDA Asset to Work"
    reader_question: "What am I dealing with?"
    body_blocks:
      - type: paragraph
        text: "The chain below is what has to hold together for an SDA dwelling to convert into transaction value. Enrolment alone does not create funding. Funding alone does not create occupancy. Occupancy alone does not create claimable, collected cash."
      - type: paragraph
        text: "The SDA Rules set these conditions out independently: a registered provider, an enrolled dwelling, an eligible participant actually residing there, and alignment between the dwelling's design category and the participant's plan. All must be satisfied together; none substitutes for another."
      - type: paragraph
        text: "A healthy asset shows alignment end to end. A distressed asset shows a break somewhere in the chain, and the rest of this report is a method for finding exactly where."
    visual_type: process_chain
    visual_data:
      orientation: vertical
      steps: ["Property", "Enrolment / Certification", "Participant-Specific Funding", "Occupancy", "Provider / Contracts", "Claims / Cash", "Operating Costs", "Sustainable NOI", "Transaction Value"]
    public_source_ids: [PUB-03]
    has_review: false

  - page_id: page-07
    page_number: 7
    theme: paper
    kicker_section: "Engage Specialist"
    title: "The First 48 Hours"
    reader_question: "What should I do next?"
    body_blocks:
      - type: paragraph
        text: "The first 48 hours are not about completing full due diligence; they are about not losing ground that is hard to recover later. Six things need eyes on immediately."
    body_blocks_after_visual:
      - type: paragraph
        style: strong
        text: "Participant and provider continuity is not the same task as securing a vacant commercial building: treat it as a distinct, earlier priority."
    visual_type: six_box
    visual_data:
      lead_callout: "If the appointee is not experienced with SDA, research and appoint a specialist SDA commercial adviser early."
      boxes:
        - label: "Provider / Contracts"
          text: "Identify the current registered SDA provider and the agreements that govern the relationship. Engage with the provider immediately to understand participant continuity, housing risk, claiming access and whether any provider transition issue exists. Where the entity in administration is the provider, or related to it, assess whether an independent provider transition is required and obtain specialist and legal advice where necessary; engage constructively with the current provider in the meantime."
        - label: "People"
          text: "Identify participant continuity and housing/support risks immediately."
        - label: "Income"
          text: "Identify what is currently being claimed and where the cash lands; preserve access to claiming, occupancy and funding information."
        - label: "Enrolment"
          text: "Confirm current enrolment status and any known change or re-enrolment requirement."
        - label: "Property"
          text: "Secure the physical asset: insurance, access, condition."
        - label: "Evidence"
          text: "Start preserving records before anything is moved or lost."
    public_source_ids: [PUB-04]
    has_review: true

  - page_id: page-08
    page_number: 8
    theme: white
    kicker_section: "Commercial Vendor Due Diligence"
    title: "The First 30 Days"
    reader_question: "What should I do next?"
    body_blocks:
      - type: paragraph
        text: "Page 7 covers the first 48 hours. This page sets the sequence for the full first month: in substance, this is what Specialist SDA Commercial Vendor Due Diligence looks like once a specialist adviser (page 7) is engaged."
    body_blocks_after_visual:
      - type: paragraph
        style: callout-blue
        text: "Treat this as the default reading order, not a rule to follow lock-step. Commercial diagnosis and divestment preparation can run in parallel once time pressure is material: waiting to \"fix everything\" before considering a sale is not always the economically rational choice. Page 20 returns to this trade-off directly."
    visual_type: process_chain_detailed
    visual_data:
      steps:
        - label: "Secure"
          detail: "Protect participants, income, enrolment, property and records."
        - label: "Reconcile"
          detail: "Establish what is actually being claimed, collected and spent, against what the file says should be happening."
        - label: "Diagnose"
          detail: "Identify which links in the page 6 chain are broken, and why (page 14)."
        - label: "Stabilise"
          detail: "Close the gaps worth closing before any transaction."
        - label: "Value"
          detail: "Test the current valuation assumptions and establish the relevant value reference points, rather than relying on a pre-appointment valuation (page 13)."
        - label: "Decide"
          detail: "Hold, stabilise further, sell as-is, or restructure the provider relationship (page 18)."
    public_source_ids: []
    has_review: false

  - page_id: page-09
    page_number: 9
    theme: white
    kicker_section: "Due Diligence"
    title: "From Maximum SDA Price to Actual Cash"
    reader_question: "Is the revenue real?"
    body_blocks:
      - type: paragraph
        text: "NDIS SDA pricing sets maximum prices for SDA supports: the NDIA describes them as \"appropriate and reasonable maximum prices,\" not guaranteed income, and its price calculator is an expected-income tool, not proof that a specific dwelling will receive that amount."
      - type: paragraph
        text: "Getting from that headline price to cash in a property's account means the revenue has to survive five more steps: funding attached to a specific participant, alignment between that funding and this dwelling, actual physical occupancy, a claim correctly lodged, and a claim actually paid and collected."
      - type: paragraph
        text: "The SDA pricing framework does not remove the owner's commercial exposure to the difference between theoretical pricing and realised property income: a gap that can arise from funding, occupancy, claiming or provider execution, not only from the pricing framework itself. Testing where that gap actually sits, asset by asset, is core Commercial Due Diligence work before a vendor pathway is chosen."
      - type: paragraph
        text: "This page stops at cash received. What that cash is actually worth once operating costs are taken out is page 12's question, not this one."
    visual_type: process_chain
    visual_data:
      orientation: vertical
      steps: ["Maximum SDA Price", "Participant-Specific Funding", "Funding Aligned With Dwelling", "Physical Occupancy", "Claimable Income", "Cash Actually Received"]
      emphasis_last: true
    public_source_ids: [PUB-02]
    has_review: false

  - page_id: page-10
    page_number: 10
    theme: paper
    kicker_section: "Due Diligence"
    title: "Occupied Does Not Necessarily Mean Performing"
    reader_question: "Why can an occupied SDA place still underperform economically?"
    body_blocks:
      - type: paragraph
        text: "A dwelling can look fully occupied and still underperform economically. Physical presence is not the same as funding, and funding is not the same as a lodged and collected claim."
      - type: paragraph
        text: "In practice this shows up as: funding that has not yet come through for a resident who has moved in; funding that does not match this dwelling's design category; a participant paying market rent rather than an aligned SDA arrangement; short-term, non-SDA support propping up occupancy; or a claim sitting unlodged or unpaid."
      - type: paragraph
        text: "Each of these produces the same headline number, \"occupied,\" while producing a different income result. The gap between the two is usually where specialist diagnosis finds the surprise."
      - type: paragraph
        text: "In some cases the existing participant or tenant mix may itself constrain the dwelling's in-use capital value. In other cases, particularly sole-occupancy dwellings, a short-term residential tenancy strategy may be commercially preferable to carrying prolonged vacancy while the longer-term SDA position is assessed, subject to the relevant tenancy, SDA, funding and contractual position. This is a strategic option to test, not a default recommendation: moving an SDA dwelling temporarily into the general residential market is not necessarily frictionless."
      - type: paragraph
        text: "Page 19 turns this into a question of who determines whether that occupancy actually holds value. Here, the point is simpler: verify income, don't infer it from occupancy."
    visual_type: quad_2x2
    visual_data:
      x_label: "Physically occupied"
      y_label: "Income performing"
      highlight_cell: "occupied_not_performing"
    public_source_ids: [PUB-09, PUB-10]
    has_review: false

  - page_id: page-11
    page_number: 11
    theme: white
    kicker_section: "Due Diligence"
    title: "The Provider, Contractual and Participant Information Layer"
    reader_question: "Why is this information hard to see, and does that stop diagnosis?"
    body_blocks:
      - type: paragraph
        text: "SDA providers carry regulatory obligations under the SDA Rules: registration, enrolment maintenance, and compliance with the Rules' service requirements. Layered on top is a commercial agreement that allocates the economics between owner and provider. That second layer is not incidental; it can materially affect control, transition execution and saleability."
      - type: paragraph
        text: "The relationship between owner, SDA provider, participants, participant funding, SIL/support providers and tenancy documentation can also make relevant commercial information genuinely difficult for an owner, lender or appointee to see clearly. That is not, on its own, a reason to stop diagnosis. Relevant commercial information can often be obtained and analysed in a de-identified manner that respects participant privacy and choice and control; this report does not give privacy or legal advice on how, only notes that the absence of direct participant detail should not automatically be read as an absence of diagnosable information."
      - type: paragraph
        text: "A provider change carries its own timing risk. Current NDIS guidance is specific: where a dwelling's existing SDA provider stops managing it, that provider's enrolment is cancelled, and the dwelling cannot support SDA payment claims until re-enrolled. The incoming provider must submit a new application, treated as new even where the dwelling was previously enrolled, not as a continuation or transfer. The cost and work required can range from minimal to material, depending on the dwelling, documentation and certification."
    body_blocks_after_visual:
      - type: paragraph
        text: "Twelve recurring commercial questions, evidenced across a working sample of SDA agreements, cover this ground and can stand on their own as a commercial reference."
    visual_type: split_and_numbered
    visual_data:
      regulatory:
        label: "Regulatory layer (SDA Rules)"
        text: "SDA providers carry regulatory obligations under the SDA Rules: registration, enrolment maintenance, and compliance with the Rules' service requirements."
      commercial:
        label: "Commercial layer (the agreement)"
        text: "A commercial agreement allocates the economics: who receives the SDA payment, who receives reasonable rent contribution, what fee the provider charges and on what base, who carries vacancy exposure, who pays routine maintenance versus capital works, and what happens on sale, breach, loss of registration or insolvency. This second layer is not incidental; it can materially affect control, transition execution and saleability."
      questions:
        - "Who is the registered provider?"
        - "Who receives SDA payments?"
        - "Who receives RRC / other rent?"
        - "What fee, on what base?"
        - "Who sources/places participants?"
        - "Who bears vacancy exposure?"
        - "Who handles tenancy administration?"
        - "Who pays routine maintenance?"
        - "Who pays capital works / certification?"
        - "What happens on sale or transfer?"
        - "What happens on breach, loss of registration or insolvency?"
        - "What does assignment/transition require?"
    public_source_ids: [PUB-03, PUB-04, PUB-08]
    has_review: false

  - page_id: page-12
    page_number: 12
    theme: paper
    kicker_section: "Due Diligence"
    title: "From Actual Income to Sustainable NOI"
    reader_question: "What does the asset actually earn on a sustainable basis?"
    body_blocks:
      - type: paragraph
        text: "Accounting profit is not automatically transaction NOI. A sale-purpose reconciliation starts from actual or annualised property income, not the headline price from page 9, and works down through the costs of running the asset day to day: provider and management fees, property outgoings (rates, insurance, water), routine repairs and maintenance, and occupancy normalised across a period rather than read off a single point in time. Non-recurring operating income or expenses are treated as normalisation adjustments where appropriate, depending on their nature. The result is normalised, sustainable NOI, not the accounting P&L, and not the maximum SDA price from page 9."
    body_blocks_after_visual:
      - type: paragraph
        text: "No single percentage applies to any of these steps across every asset; each has to be derived from the specific dwelling's own record, not assumed from a rule of thumb. This reconciliation is precisely what the diligence process tests before a sale, not something a headline P&L can substitute for."
    visual_type: dual_block
    visual_data:
      lead_note: "Sustainable NOI is not the same as post-CAPEX cash flow."
      noi_steps: ["Actual / Annualised Property Income", "Provider / Management Cost", "Property Operating Costs", "Routine R&M", "Occupancy / Vacancy Normalisation", "Normalised / Sustainable NOI"]
      below_label: "Considered separately from normalised NOI"
      below_items: ["Known CAPEX / capital works", "Capital reserves where adopted", "Lease-up / stabilisation capital requirements"]
    public_source_ids: []
    has_review: false

  - page_id: page-13
    page_number: 13
    theme: white
    kicker_section: "Due Diligence"
    title: "Value References, Remaining Pricing Tenure and Highest and Best Use"
    reader_question: "Where is the value, and for how long does the current pricing basis last?"
    body_blocks:
      - type: paragraph
        text: "Two independently assessable value references frame the position for an SDA asset."
      - type: paragraph
        marker: navy
        text: "**SDA In-Use Value Reference** is a valuation of the asset operating under adopted assumptions: occupancy, funding, provider performance and cost structure."
      - type: paragraph
        marker: blue
        text: "**Alternative-Use / Underlying Property Value Reference** is a valuation of the underlying property under the relevant alternative-use assumptions."
      - type: paragraph
        text: "Professional valuers assess these on different bases, and they can differ materially, in either direction, depending on location, design and local demand. SDAHC has observed cases where the SDA in-use valuation materially exceeds the underlying alternative-use value, and cases where it does not. SDA in-use is not automatically the higher value: some assets can recover substantial SDA value through remediation; others cannot, and in those cases the highest and best use may ultimately be an alternative use. The in-use reference is conditional on assumptions (design category, participant mix, occupancy, provider arrangement, operating costs, lease-up allowance) that may not hold in a distressed matter."
      - type: paragraph
        marker: amber
        text: "**Current Recovery Position** is a commercial assessment of the current position, reflecting actual occupancy, participant funding, provider arrangements, contractual friction, required CAPEX, lease-up or stabilisation time, execution risk and holding costs. Current Recovery Position is not a third independent valuation methodology."
      - type: paragraph
        text: "Verify the assumptions behind both value references, and the remaining New Build pricing tenure, before relying on a valuation produced before the appointment began."
    visual_type: reference_points
    visual_data:
      ref_a: "SDA In-Use Value Reference"
      ref_b: "Alternative-Use Property Value Reference"
      tenure_note: "Remaining New Build pricing tenure is distinct from enrolment. Check per dwelling against the applicable pricing framework and rules, which may provide for a different (Existing Stock) pricing treatment once the New Build period ends; not modelled here. A buyer may reasonably underwrite an asset differently with materially more of that period remaining than with materially less."
      current: "Current Recovery Position"
      current_note: "commercial estimate, not an independent valuation"
    public_source_ids: [PUB-02, PUB-03]
    has_review: false

  - page_id: page-14
    page_number: 14
    theme: white
    kicker_section: "Due Diligence"
    title: "What Exactly Is Impaired?"
    reader_question: "What can go wrong, and how far does the diagnosis need to go?"
    body_blocks:
      - type: paragraph
        text: "A useful starting diagnosis is to test four potential sources of impairment."
    body_blocks_after_visual:
      - type: paragraph
        text: "Identifying which source, or combination, applies determines the realistic recovery pathway. This is the working diagnosis the decision tree on page 22 tests further."
    visual_type: diagnostic_cards
    visual_data:
      cards:
        - title: "Operational"
          text: "The asset is enrolled and funded correctly, but day-to-day execution is failing: claims aren't lodged, records are poor, vacancy isn't being actively managed."
        - title: "Provider / Contractual"
          text: "The provider relationship itself is the problem: an unfavourable fee structure, unclear vacancy-risk allocation, a provider under pressure, or a contract that blocks a clean transition."
        - title: "Capital Structure"
          text: "Ownership, debt or security arrangements constrain recovery independently of, or in addition to, operating performance."
        - title: "Fundamental Asset"
          text: "Location, design category, configuration or realistic participant demand does not support the original SDA proposition."
      note: "These four sources are a diagnostic starting point, not an exhaustive substitute for Specialist SDA Commercial Vendor Due Diligence. Some engagements require a forensic level of commercial investigation: testing for hidden commercial conflicts or dependencies (related-party arrangements, undisclosed dependencies, participant/provider incentives, cross-entity arrangements) rather than an accusation against any identified party."
